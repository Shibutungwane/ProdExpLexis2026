
<app-Heading title="Favorites" subheading="products you have saved for later."></app-Heading>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:grid-cols-2 animate-in fade-in duration-500">
 @for (product of favoriteProducts(); track product.id){
<div>
   <a [routerLink]="['/product', product.id]"      class="group flex flex-col bg-white rounded-2xl border border-stone-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
   <!-- Product Card -->
<div
  class="relative aspect-square w-full group h-36 flex items-center justify-center overflow-hidden "
 [style]="{ background: product.background }"
>
  <!-- Package Icon -->

   <lucide-angular [img]="icons.Package" class="h-8 w-8 text-black transition-transform duration-500 group-hover:scale-110"></lucide-angular>

  <!-- Category Tag -->
  <div
    class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-full text-xs font-semibold text-stone-800 shadow-sm"
  >
    {{ product.category }}
  </div>

  <!-- Favorite Button -->
  <button
   (click)="handleRemove($event, product)"
    class="absolute top-3 right-3 p-2 bg-white/90 backdrop-blur-sm rounded-full text-white hover:text-rose-500 hover:bg-white shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500"
> <lucide-angular [img]="icons.Heart" class="h-4 w-4 fill-red-500"></lucide-angular>
  </button>
</div>

<!-- Product Details -->
<div class="p-5 flex flex-col grow">
  <h2
    class="text-lg font-semibold text-stone-900 line-clamp-1 transition-colors group-hover:text-red-600"
  >
    {{ product.title }}
  </h2>
  <p class="text-stone-500 text-sm mt-1 line-clamp-2 grow">
    {{ product.description }}
  </p>
  <div class="mt-4 flex items-center justify-between">
    <span class="text-lg font-bold text-stone-900">
     {{ product.price  | currency: 'ZAR' : 'symbol-narrow' : '4.2-2' }}
    </span>
    <span
      class="text-sm font-medium text-red-600 opacity-0 transition-opacity flex items-center group-hover:opacity-100"
    >
      View Details  <lucide-angular [img]="icons.ArrowRight" class=""></lucide-angular>
    </span>
  </div>
</div>
    </a>
</div>
 } @empty {
    <div class="col-span-full text-center py-12 bg-gray-50 rounded-xl">
      <p class="text-gray-500 font-medium animate-pulse">
       No Product saved
      </p>
    </div>

    }</div>
